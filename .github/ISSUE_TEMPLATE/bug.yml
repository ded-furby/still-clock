name: Bug report
description: Something is not keeping time.
body:
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 27.0.1, Apple Silicon
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Where does it happen?
      options:
        - Desktop wallpaper
        - System screen saver
        - App preview or settings
        - Installation or build
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps, expected result, and actual result
      description: Include Still's version. Remove private content from screenshots and logs.
    validations:
      required: true
